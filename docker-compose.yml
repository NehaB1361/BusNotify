version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: busnotify-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-N@ids2024}
      MYSQL_DATABASE: ${MYSQL_DB:-mysql94}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-N@ids2024}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: busnotify-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-N@ids2024}
      - MYSQL_DB=${MYSQL_DB:-mysql94}
      - SECRET_KEY=${SECRET_KEY:-busnotify-production-key-2024}
      - FLASK_ENV=production
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
