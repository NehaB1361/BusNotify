{% extends "base.html" %}

{% block title %}System Error - BusNotify{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-6">
    <div class="tf-card p-5">
      <div class="text-danger mb-3" style="font-size: 3.5rem;">
        <i class="bi bi-exclamation-octagon"></i>
      </div>
      <h3 class="fw-bold mb-2">500 - System Error</h3>
      <p class="text-muted mb-4">An unexpected server error occurred. Our transport engineering team has been notified.</p>
      <a href="{{ url_for('views.index') }}" class="btn btn-tf-primary">
        <i class="bi bi-arrow-clockwise"></i> Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
