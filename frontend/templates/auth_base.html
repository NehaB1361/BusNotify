<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E85D04">
  <title>{% block title %}BusNotify – Know your bus. Know your time.{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Transit Flow Design System CSS (shared tokens: colors, radius, shadows) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/transit-flow.css') }}">

  <style>
    /* ── Auth layout ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      /* Subtle warm-gray background matching BusNotify's light palette */
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Decorative top stripe in brand orange */
    .auth-top-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--tf-primary, #E85D04), var(--tf-secondary, #F97316));
      flex-shrink: 0;
    }

    /* Full-height centered wrapper */
    .auth-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Toast container (kept identical to base.html so js/transit-ui.js works) */
    #toastContainer {
      z-index: 2000;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Brand top stripe -->
  <div class="auth-top-bar"></div>

  <!-- Full-screen centered auth page -->
  <div class="auth-page">
    {% block content %}{% endblock %}
  </div>

  <!-- Toast container (required by transit-ui.js) -->
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- BusNotify core JS (API helper + TransitUI needed by login form) -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/transit-ui.js') }}"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
