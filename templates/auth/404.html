{% extends "base.html" %}

{% block title %}Page Not Found - BusNotify{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-6">
    <div class="tf-card p-5">
      <div class="text-warning mb-3" style="font-size: 3.5rem;">
        <i class="bi bi-compass"></i>
      </div>
      <h3 class="fw-bold mb-2">404 - Page Not Found</h3>
      <p class="text-muted mb-4">The transit route or page you are looking for does not exist or has been moved.</p>
      <a href="{{ url_for('views.index') }}" class="btn btn-tf-primary">
        <i class="bi bi-house"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
